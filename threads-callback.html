<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threads連携 - TARA SISTER</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-main" style="max-width:560px;margin:3rem auto;">
    <div class="card">
      <h3>Threads連携</h3>
      <p id="cb-msg">処理中...</p>
      <p style="margin-top:1rem"><a href="index.html" class="btn btn-secondary btn-sm">ダッシュボードへ戻る</a></p>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      const msg = document.getElementById('cb-msg');
      const params = new URLSearchParams(location.search);
      const code = (params.get('code') || '').replace(/#_$/, '');
      if (params.get('error')) {
        msg.textContent = '連携がキャンセルされました: ' + (params.get('error_description') || params.get('error'));
        return;
      }
      if (!code) { msg.textContent = 'code が見つかりません。ダッシュボードから連携をやり直してください。'; return; }
      if (!Auth.init()) { msg.textContent = '先にログインしてから連携ボタンを押してください。'; return; }
      try {
        const st = await API.request('threadsExchange', null, { code });
        const exp = st.expires ? new Date(st.expires).toLocaleDateString('ja-JP') : '-';
        msg.textContent = '✅ Threads連携が完了しました（有効期限: ' + exp + '）';
      } catch (e) {
        msg.textContent = '連携に失敗しました: ' + e.message;
      }
    })();
  </script>
</body>
</html>
